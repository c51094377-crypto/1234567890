<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js GLB Viewer - WASD L/R Direction Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #18181b;
      color: #f4f4f5;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* コントロールパネル */
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 290px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .file-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 14px;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }
    .file-btn:hover { background: #2563eb; }
    #file-input { display: none; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      font-size: 13px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #f4f4f5;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.secondary:hover { background: rgba(255, 255, 255, 0.2); }

    /* WASD コントロールグリッド */
    .wasd-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .wasd-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .wasd-btn strong {
      font-size: 13px;
      color: #fff;
    }
    .wasd-btn span {
      font-size: 10px;
      color: #a1a1aa;
    }
    .wasd-btn:hover {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
    }
    .wasd-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #fff;
    }
    .wasd-btn.active span {
      color: #eff6ff;
    }

    select, input[type="range"] {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
    }
    input[type="range"] { width: 120px; padding: 0; }
    input[type="checkbox"] { accent-color: #3b82f6; cursor: pointer; }

    #file-name {
      font-size: 12px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #path-status {
      font-size: 11px;
      color: #60a5fa;
      line-height: 1.4;
    }

    /* ドラッグ＆ドロップオーバーレイ */
    #drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(59, 130, 246, 0.2);
      border: 3px dashed #3b82f6;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      z-index: 20;
      pointer-events: none;
    }
    #drop-overlay.active { display: flex; }

    /* 初期案内 */
    #empty-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #71717a;
      pointer-events: none;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>

  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="empty-hint">
    左上のボタンからファイルを選択するか、<br>
    ここに .glb / .gltf ファイルをドロップしてください
  </div>

  <div id="drop-overlay">GLB / glTF ファイルをドロップして読み込み</div>

  <div id="ui-panel">
    <h1>GLB 3D Viewer</h1>
    <label class="file-btn" for="file-input">GLBファイルを選択</label>
    <input type="file" id="file-input" accept=".glb,.gltf" />
    <div id="file-name">未選択</div>

    <!-- L1〜L72 & R1〜R72 WASD方向コントロール -->
    <div class="control-group" id="path-group" style="display: none;">
      <div class="row">
        <span>L / R 循環移動</span>
        <input type="checkbox" id="path-move-toggle" checked />
      </div>
      <div class="row">
        <span>XYZ角度も同期</span>
        <input type="checkbox" id="path-rot-toggle" checked />
      </div>
      <div class="row">
        <span>移動速度</span>
        <input type="range" id="path-speed-slider" min="0.1" max="15" step="0.1" value="3.0" />
      </div>

      <!-- WASD キー操作ボタン -->
      <div class="wasd-grid">
        <div></div>
        <button class="wasd-btn" id="btn-w" data-key="w">
          <strong>W</strong>
          <span>L/R: 1→72</span>
        </button>
        <div></div>
        <button class="wasd-btn" id="btn-a" data-key="a">
          <strong>A</strong>
          <span>L:1→2 / R:1→72</span>
        </button>
        <button class="wasd-btn active" id="btn-s" data-key="s">
          <strong>S</strong>
          <span>L/R: 1→2</span>
        </button>
        <button class="wasd-btn" id="btn-d" data-key="d">
          <strong>D</strong>
          <span>L:1→72 / R:1→2</span>
        </button>
      </div>

      <div id="path-status">検出: L 0個 / R 0個</div>
    </div>

    <div class="control-group">
      <div class="row">
        <span>ワイヤーフレーム</span>
        <input type="checkbox" id="wireframe-toggle" />
      </div>
      <div class="row">
        <span>自動回転</span>
        <input type="checkbox" id="autorotate-toggle" />
      </div>
      <div class="row">
        <span>グリッド表示</span>
        <input type="checkbox" id="grid-toggle" checked />
      </div>
      <div class="row">
        <span>照明の明るさ</span>
        <input type="range" id="light-slider" min="0.2" max="4" step="0.1" value="1.5" />
      </div>
      <div class="row">
        <span>背景色</span>
        <select id="bg-select">
          <option value="#18181b">ダーク</option>
          <option value="#3f3f46">グレー</option>
          <option value="#e4e4e7">ライト</option>
          <option value="#ffffff">ホワイト</option>
        </select>
      </div>
      <div class="row">
        <span>カメラ</span>
        <button class="secondary" id="reset-camera-btn">視点リセット</button>
      </div>
    </div>

    <div class="control-group" id="anim-group" style="display: none;">
      <div class="row">
        <span>アニメーション</span>
        <button class="secondary" id="anim-play-btn">一時停止</button>
      </div>
      <select id="anim-select"></select>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // 基本セットアップ
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#18181b');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(2, 2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // 環境光
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    // グリッド
    const gridHelper = new THREE.GridHelper(10, 20, 0x52525b, 0x27272a);
    scene.add(gridHelper);

    // カメラ操作
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // GLTF / Draco ローダー
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    // 状態管理
    let currentModel = null;
    let mixer = null;
    let animations = [];
    let activeAction = null;
    let isPlaying = true;
    let defaultCameraPos = new THREE.Vector3(2, 2, 4);
    let defaultTarget = new THREE.Vector3(0, 0, 0);
    const clock = new THREE.Clock();

    // L1〜L72 と R1〜R72 の循環移動グループ管理（それぞれ個別の direction を持つ）
    // direction: 1 = 1→2 (順方向), -1 = 1→72 (逆方向)
    let pathGroups = {
      L: { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1 },
      R: { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1 }
    };
    let isPathMoving = true;
    let isSyncRotation = true;
    let pathSpeedMultiplier = 3.0;

    // 正の剰余を返すヘルパー
    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    // モデルの解放処理
    function clearCurrentModel() {
      if (!currentModel) return;
      scene.remove(currentModel);
      currentModel.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (Array.isArray(child.material)) {
            child.material.forEach((m) => m.dispose());
          } else if (child.material) {
            child.material.dispose();
          }
        }
      });
      currentModel = null;
      mixer = null;
      animations = [];
      activeAction = null;
      pathGroups.L = { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1 };
      pathGroups.R = { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1 };
      document.getElementById('anim-group').style.display = 'none';
      document.getElementById('path-group').style.display = 'none';
    }

    // L1〜L72 および R1〜R72 の全メッシュ検出と初期トランスフォームの記録
    function setupPaths(model) {
      model.updateMatrixWorld(true);
      const foundMap = {};

      model.traverse((child) => {
        if (/^[LR]([1-9]|[1-6][0-9]|7[0-2])$/.test(child.name)) {
          if (!foundMap[child.name] || child.isMesh) {
            foundMap[child.name] = child;
          }
        }
      });

      ['L', 'R'].forEach((prefix) => {
        const nodes = [];
        for (let i = 1; i <= 72; i++) {
          const mesh = foundMap[`${prefix}${i}`];
          if (mesh) {
            const baseWorldPos = new THREE.Vector3();
            const baseWorldQuat = new THREE.Quaternion();
            mesh.getWorldPosition(baseWorldPos);
            mesh.getWorldQuaternion(baseWorldQuat);

            nodes.push({
              name: `${prefix}${i}`,
              mesh,
              baseWorldPos,
              baseWorldQuat,
              initialLocalQuat: mesh.quaternion.clone()
            });
          }
        }
        pathGroups[prefix] = {
          nodes,
          stepOffset: 0,
          segmentProgress: 0,
          direction: 1 // 初期状態は S (1→2)
        };
      });

      const lCount = pathGroups.L.nodes.length;
      const rCount = pathGroups.R.nodes.length;
      const pathGroupEl = document.getElementById('path-group');

      if (lCount >= 2 || rCount >= 2) {
        pathGroupEl.style.display = 'flex';
        updateActiveWASDButton('s');
        updatePathStatusText();
      } else {
        pathGroupEl.style.display = 'none';
      }
    }

    // 個別グループの進行方向をシームレスに変更する
    function setGroupDirection(group, newDir) {
      if (group.direction === newDir) return;
      const count = group.nodes.length;
      if (count >= 2) {
        // 移動の途中なら現在区間を折り返す
        group.stepOffset = mod(group.stepOffset + group.direction, count);
        group.segmentProgress = group.segmentProgress > 0 ? (1 - group.segmentProgress) : 0;
      }
      group.direction = newDir;
    }

    // WASDモード適用
    function applyWASDMode(key) {
      const k = key.toLowerCase();
      if (k === 'w') {
        // W: 1→72
        setGroupDirection(pathGroups.L, -1);
        setGroupDirection(pathGroups.R, -1);
      } else if (k === 's') {
        // S: 1→2
        setGroupDirection(pathGroups.L, 1);
        setGroupDirection(pathGroups.R, 1);
      } else if (k === 'a') {
        // A: Lは1→2、Rは1→72
        setGroupDirection(pathGroups.L, 1);
        setGroupDirection(pathGroups.R, -1);
      } else if (k === 'd') {
        // D: Lは1→72、Rは1→2
        setGroupDirection(pathGroups.L, -1);
        setGroupDirection(pathGroups.R, 1);
      } else {
        return;
      }

      updateActiveWASDButton(k);
      updatePathStatusText();
    }

    function updateActiveWASDButton(activeKey) {
      document.querySelectorAll('.wasd-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.key === activeKey);
      });
    }

    function updatePathStatusText() {
      const lGroup = pathGroups.L;
      const rGroup = pathGroups.R;
      const parts = [];

      if (lGroup.nodes.length >= 2) {
        const len = lGroup.nodes.length;
        const nextL = lGroup.nodes[mod(lGroup.stepOffset + lGroup.direction, len)].name;
        const modeL = lGroup.direction === 1 ? '1→2' : '1→72';
        parts.push(`L[${modeL}]: L1→${nextL}`);
      }
      if (rGroup.nodes.length >= 2) {
        const len = rGroup.nodes.length;
        const nextR = rGroup.nodes[mod(rGroup.stepOffset + rGroup.direction, len)].name;
        const modeR = rGroup.direction === 1 ? '1→2' : '1→72';
        parts.push(`R[${modeR}]: R1→${nextR}`);
      }
      document.getElementById('path-status').textContent = parts.join(' / ');
    }

    // ワールド座標・回転を各メッシュの親ローカル空間へ変換して適用するヘルパー
    const _tempPos = new THREE.Vector3();
    const _tempQuat = new THREE.Quaternion();
    const _parentWorldQuat = new THREE.Quaternion();

    function applyTransformFromSlot(item, slotA, slotB, t) {
      const mesh = item.mesh;

      _tempPos.lerpVectors(slotA.baseWorldPos, slotB.baseWorldPos, t);
      if (mesh.parent) {
        mesh.parent.worldToLocal(_tempPos);
      }
      mesh.position.copy(_tempPos);

      if (isSyncRotation) {
        _tempQuat.slerpQuaternions(slotA.baseWorldQuat, slotB.baseWorldQuat, t);
        if (mesh.parent) {
          mesh.parent.getWorldQuaternion(_parentWorldQuat);
          _tempQuat.premultiply(_parentWorldQuat.invert());
        }
        mesh.quaternion.copy(_tempQuat);
      }
    }

    // 1グループ分の等速・連続循環移動更新
    function updateGroupMovement(group, delta) {
      const count = group.nodes.length;
      if (count < 2) return false;

      const dir = group.direction;
      let stepped = false;
      let remainingBudget = pathSpeedMultiplier * delta;

      let safetyGuard = 0;
      while (remainingBudget > 0 && safetyGuard < count) {
        safetyGuard++;
        const refFrom = group.nodes[mod(group.stepOffset, count)];
        const refTo = group.nodes[mod(group.stepOffset + dir, count)];
        const distance = refFrom.baseWorldPos.distanceTo(refTo.baseWorldPos);
        const angleDiff = refFrom.baseWorldQuat.angleTo(refTo.baseWorldQuat);

        const segmentLength = Math.max(distance, angleDiff * 0.5, 0.001);
        const remainingInSegment = (1 - group.segmentProgress) * segmentLength;

        if (remainingBudget >= remainingInSegment) {
          remainingBudget -= remainingInSegment;
          group.segmentProgress = 0;
          group.stepOffset = mod(group.stepOffset + dir, count);
          stepped = true;
        } else {
          group.segmentProgress += remainingBudget / segmentLength;
          remainingBudget = 0;
        }
      }

      const t = group.segmentProgress;

      for (let i = 0; i < count; i++) {
        const fromSlot = group.nodes[mod(i + group.stepOffset, count)];
        const toSlot = group.nodes[mod(i + group.stepOffset + dir, count)];
        applyTransformFromSlot(group.nodes[i], fromSlot, toSlot, t);
      }

      return stepped;
    }

    // L・R全グループの更新
    function updateAllPathsMovement(delta) {
      if (!isPathMoving) return;
      const steppedL = updateGroupMovement(pathGroups.L, delta);
      const steppedR = updateGroupMovement(pathGroups.R, delta);
      if (steppedL || steppedR) {
        updatePathStatusText();
      }
    }

    // モデルのセンタリングとカメラ自動調整
    function fitModelToView(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      model.position.x += (model.position.x - center.x);
      model.position.y += (model.position.y - box.min.y);
      model.position.z += (model.position.z - center.z);

      const newBox = new THREE.Box3().setFromObject(model);
      const newCenter = newBox.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const fov = camera.fov * (Math.PI / 180);
      const distance = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 1.6;

      defaultTarget.copy(newCenter);
      defaultCameraPos.set(
        newCenter.x + distance * 0.7,
        newCenter.y + distance * 0.5,
        newCenter.z + distance * 0.9
      );

      camera.near = maxDim / 100;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();

      resetCamera();
    }

    function resetCamera() {
      camera.position.copy(defaultCameraPos);
      controls.target.copy(defaultTarget);
      controls.update();
    }

    // GLBファイル読み込み
    function loadGLBFile(file) {
      if (!file) return;
      const url = URL.createObjectURL(file);
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('empty-hint').style.display = 'none';

      loader.load(
        url,
        (gltf) => {
          clearCurrentModel();
          currentModel = gltf.scene;
          scene.add(currentModel);
          fitModelToView(currentModel);
          setupPaths(currentModel);
          applyWireframe(document.getElementById('wireframe-toggle').checked);

          if (gltf.animations && gltf.animations.length > 0) {
            animations = gltf.animations;
            mixer = new THREE.AnimationMixer(currentModel);
            const animSelect = document.getElementById('anim-select');
            animSelect.innerHTML = '';
            animations.forEach((clip, index) => {
              const option = document.createElement('option');
              option.value = index;
              option.textContent = clip.name || `Animation ${index + 1}`;
              animSelect.appendChild(option);
            });
            document.getElementById('anim-group').style.display = 'flex';
            playAnimation(0);
          }
          URL.revokeObjectURL(url);
        },
        undefined,
        (error) => {
          console.error('GLB読み込みエラー:', error);
          alert('ファイルの読み込みに失敗しました。有効な .glb / .gltf ファイルか確認してください。');
          URL.revokeObjectURL(url);
        }
      );
    }

    function playAnimation(index) {
      if (!mixer || !animations[index]) return;
      if (activeAction) activeAction.stop();
      activeAction = mixer.clipAction(animations[index]);
      activeAction.play();
      isPlaying = true;
      document.getElementById('anim-play-btn').textContent = '一時停止';
    }

    function applyWireframe(enabled) {
      if (!currentModel) return;
      currentModel.traverse((child) => {
        if (child.isMesh && child.material) {
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((mat) => { mat.wireframe = enabled; });
        }
      });
    }

    // UIイベント
    document.getElementById('file-input').addEventListener('change', (e) => {
      loadGLBFile(e.target.files[0]);
    });

    document.getElementById('path-move-toggle').addEventListener('change', (e) => {
      isPathMoving = e.target.checked;
    });

    document.getElementById('path-rot-toggle').addEventListener('change', (e) => {
      isSyncRotation = e.target.checked;
      if (!isSyncRotation) {
        ['L', 'R'].forEach((prefix) => {
          pathGroups[prefix].nodes.forEach((item) => {
            item.mesh.quaternion.copy(item.initialLocalQuat);
          });
        });
      }
    });

    document.getElementById('path-speed-slider').addEventListener('input', (e) => {
      pathSpeedMultiplier = parseFloat(e.target.value);
    });

    // WASD ボタンクリック操作
    document.querySelectorAll('.wasd-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        applyWASDMode(btn.dataset.key);
      });
    });

    // WASD キーボード操作
    window.addEventListener('keydown', (e) => {
      // 入力フォームにフォーカスがある場合は無視
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      const key = e.key.toLowerCase();
      if (['w', 'a', 's', 'd'].includes(key)) {
        applyWASDMode(key);
      }
    });

    document.getElementById('wireframe-toggle').addEventListener('change', (e) => {
      applyWireframe(e.target.checked);
    });

    document.getElementById('autorotate-toggle').addEventListener('change', (e) => {
      controls.autoRotate = e.target.checked;
    });

    document.getElementById('grid-toggle').addEventListener('change', (e) => {
      gridHelper.visible = e.target.checked;
    });

    document.getElementById('light-slider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      dirLight.intensity = val;
      renderer.toneMappingExposure = val / 1.5;
    });

    document.getElementById('bg-select').addEventListener('change', (e) => {
      scene.background = new THREE.Color(e.target.value);
    });

    document.getElementById('reset-camera-btn').addEventListener('click', resetCamera);

    document.getElementById('anim-select').addEventListener('change', (e) => {
      playAnimation(parseInt(e.target.value, 10));
    });

    document.getElementById('anim-play-btn').addEventListener('click', () => {
      if (!activeAction) return;
      isPlaying = !isPlaying;
      activeAction.paused = !isPlaying;
      document.getElementById('anim-play-btn').textContent = isPlaying ? '一時停止' : '再生';
    });

    // ドラッグ＆ドロップ
    const dropOverlay = document.getElementById('drop-overlay');
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) dropOverlay.classList.remove('active');
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      if (e.dataTransfer.files.length > 0) {
        loadGLBFile(e.dataTransfer.files[0]);
      }
    });

    // リサイズ対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 描画ループ
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && isPlaying) mixer.update(delta);
      updateAllPathsMovement(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
