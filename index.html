<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js GLB Viewer - Turret & Barrel Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #18181b;
      color: #f4f4f5;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* コントロールパネル */
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 290px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .file-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 14px;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }
    .file-btn:hover { background: #2563eb; }
    #file-input { display: none; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      font-size: 13px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #f4f4f5;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.secondary:hover { background: rgba(255, 255, 255, 0.2); }

    /* WASD コントロールグリッド */
    .wasd-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .wasd-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .wasd-btn strong {
      font-size: 13px;
      color: #fff;
    }
    .wasd-btn span {
      font-size: 10px;
      color: #a1a1aa;
    }
    .wasd-btn:hover {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
    }
    .wasd-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #fff;
    }
    .wasd-btn.active span {
      color: #eff6ff;
    }

    select, input[type="range"] {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
    }
    input[type="range"] { width: 120px; padding: 0; }
    input[type="checkbox"] { accent-color: #3b82f6; cursor: pointer; }

    #file-name {
      font-size: 12px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #path-status {
      font-size: 11px;
      color: #60a5fa;
      line-height: 1.4;
    }

    /* ドラッグ＆ドロップオーバーレイ */
    #drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(59, 130, 246, 0.2);
      border: 3px dashed #3b82f6;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      z-index: 20;
      pointer-events: none;
    }
    #drop-overlay.active { display: flex; }

    /* 初期案内 */
    #empty-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #71717a;
      pointer-events: none;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>

  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="empty-hint">
    左上のボタンからファイルを選択するか、<br>
    ここに .glb / .gltf ファイルをドロップしてください
  </div>

  <div id="drop-overlay">GLB / glTF ファイルをドロップして読み込み</div>

  <div id="ui-panel">
    <h1>GLB 3D Viewer</h1>
    <label class="file-btn" for="file-input">GLBファイルを選択</label>
    <input type="file" id="file-input" accept=".glb,.gltf" />
    <div id="file-name">未選択</div>

    <div class="control-group" id="path-group" style="display: none;">
      <div class="row">
        <span>XYZ角度も同期</span>
        <input type="checkbox" id="path-rot-toggle" checked />
      </div>
      <div class="row">
        <span>最高速度</span>
        <input type="range" id="path-speed-slider" min="0.1" max="15" step="0.1" value="3.0" />
      </div>
      <div class="row">
        <span>慣性（滑らかさ）</span>
        <input type="range" id="inertia-slider" min="1" max="10" step="0.5" value="4.0" />
      </div>

      <div style="font-size: 11px; color: #a1a1aa; margin-top: 2px;">
        WASDで慣性つき移動 / Q,Eで砲塔旋回 / R,Fで砲身昇降 / 1:車長 2:射手
      </div>
      <div class="wasd-grid">
        <div></div>
        <button class="wasd-btn" id="btn-w" data-key="w">
          <strong>W</strong>
          <span>L/R: 1→79</span>
        </button>
        <div></div>
        <button class="wasd-btn" id="btn-a" data-key="a">
          <strong>A</strong>
          <span>L:+X / R:-X</span>
        </button>
        <button class="wasd-btn" id="btn-s" data-key="s">
          <strong>S</strong>
          <span>L/R: 1→2</span>
        </button>
        <button class="wasd-btn" id="btn-d" data-key="d">
          <strong>D</strong>
          <span>L:-X / R:+X</span>
        </button>
      </div>

      <div id="path-status">停止中 (慣性待機)</div>
    </div>

    <div class="control-group">
      <div class="row">
        <span>ワイヤーフレーム</span>
        <input type="checkbox" id="wireframe-toggle" />
      </div>
      <div class="row">
        <span>自動回転</span>
        <input type="checkbox" id="autorotate-toggle" />
      </div>
      <div class="row">
        <span>グリッド表示</span>
        <input type="checkbox" id="grid-toggle" checked />
      </div>
      <div class="row">
        <span>照明の明るさ</span>
        <input type="range" id="light-slider" min="0.2" max="4" step="0.1" value="1.5" />
      </div>
      <div class="row">
        <span>背景色</span>
        <select id="bg-select">
          <option value="#18181b">ダーク</option>
          <option value="#3f3f46">グレー</option>
          <option value="#e4e4e7">ライト</option>
          <option value="#ffffff">ホワイト</option>
        </select>
      </div>
      <div class="row">
        <span>カメラ</span>
        <button class="secondary" id="reset-camera-btn">視点リセット</button>
      </div>
    </div>

    <div class="control-group" id="anim-group" style="display: none;">
      <div class="row">
        <span>アニメーション</span>
        <button class="secondary" id="anim-play-btn">一時停止</button>
      </div>
      <select id="anim-select"></select>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // 基本セットアップ
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#18181b');

    const defaultCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
    defaultCamera.position.set(2, 2, 4);
    let activeCamera = defaultCamera;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    const gridHelper = new THREE.GridHelper(10, 20, 0x52525b, 0x27272a);
    scene.add(gridHelper);

    const controls = new OrbitControls(defaultCamera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    let currentModel = null;
    let mixer = null;
    let animations = [];
    let activeAction = null;
    let isPlaying = true;
    let defaultCameraPos = new THREE.Vector3(2, 2, 4);
    let defaultTarget = new THREE.Vector3(0, 0, 0);
    const clock = new THREE.Clock();

    let pathGroups = {
      L: { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1, currentSpeed: 0, targetDirection: 1, wheelDir: 1, linearDistanceMoved: 0 },
      R: { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1, currentSpeed: 0, targetDirection: 1, wheelDir: 1, linearDistanceMoved: 0 }
    };
    let activeKey = null;
    let isSyncRotation = true;
    let pathSpeedMultiplier = 3.0;
    let inertiaFactor = 4.0;

    let lDriveWheel = null;
    let rDriveWheel = null;
    let lAssociatedWheels = [];
    let rAssociatedWheels = [];

    // 砲塔・砲身用変数（慣性速度追加）
    let turretMesh = null;
    let barrelMesh = null;
    let turretCurrentVel = 0;
    let barrelCurrentVel = 0;
    let keysPressed = {};

    // APC移動・旋回用変数
    let apcMesh = null;
    let trackSpanWidth = 1.0;

    // ファイル内カメラ用変数（車長・射手）
    let commanderCamera = null;
    let gunnerCamera = null;
    let commanderInitialQuat = null;
    let gunnerInitialQuat = null;
    let lookYaw = 0;
    let lookPitch = 0;
    let isPointerLooking = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    function getMeshRadius(mesh) {
      if (!mesh) return 0.3;
      const box = new THREE.Box3().setFromObject(mesh);
      const size = box.getSize(new THREE.Vector3());
      const radius = Math.max(size.y, size.z) * 0.5;
      return radius > 0.001 ? radius : 0.3;
    }

    function switchCameraMode(mode) {
      if (mode === 'commander' && commanderCamera) {
        activeCamera = commanderCamera;
        controls.enabled = false;
        lookYaw = 0;
        lookPitch = 0;
        updateFirstPersonLook();
      } else if (mode === 'gunner' && gunnerCamera) {
        activeCamera = gunnerCamera;
        controls.enabled = false;
        lookYaw = 0;
        lookPitch = 0;
        updateFirstPersonLook();
      } else {
        activeCamera = defaultCamera;
        controls.enabled = true;
      }
      updateCameraAspect();
    }

    function updateFirstPersonLook() {
      if (activeCamera === commanderCamera && commanderCamera && commanderInitialQuat) {
        const euler = new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ');
        const offsetQuat = new THREE.Quaternion().setFromEuler(euler);
        commanderCamera.quaternion.copy(commanderInitialQuat).multiply(offsetQuat);
      } else if (activeCamera === gunnerCamera && gunnerCamera && gunnerInitialQuat) {
        const euler = new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ');
        const offsetQuat = new THREE.Quaternion().setFromEuler(euler);
        gunnerCamera.quaternion.copy(gunnerInitialQuat).multiply(offsetQuat);
      }
    }

    function updateCameraAspect() {
      if (activeCamera && activeCamera.isPerspectiveCamera) {
        activeCamera.aspect = window.innerWidth / window.innerHeight;
        activeCamera.updateProjectionMatrix();
      }
    }

    function clearCurrentModel() {
      if (!currentModel) return;
      scene.remove(currentModel);
      currentModel.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (Array.isArray(child.material)) {
            child.material.forEach((m) => m.dispose());
          } else if (child.material) {
            child.material.dispose();
          }
        }
      });
      currentModel = null;
      mixer = null;
      animations = [];
      activeAction = null;
      pathGroups.L = { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1, currentSpeed: 0, targetDirection: 1, wheelDir: 1, linearDistanceMoved: 0 };
      pathGroups.R = { nodes: [], stepOffset: 0, segmentProgress: 0, direction: 1, currentSpeed: 0, targetDirection: 1, wheelDir: 1, linearDistanceMoved: 0 };
      lDriveWheel = null;
      rDriveWheel = null;
      lAssociatedWheels = [];
      rAssociatedWheels = [];
      turretMesh = null;
      barrelMesh = null;
      turretCurrentVel = 0;
      barrelCurrentVel = 0;
      apcMesh = null;
      trackSpanWidth = 1.0;
      commanderCamera = null;
      gunnerCamera = null;
      commanderInitialQuat = null;
      gunnerInitialQuat = null;
      lookYaw = 0;
      lookPitch = 0;
      activeCamera = defaultCamera;
      controls.enabled = true;
      activeKey = null;
      keysPressed = {};
      document.getElementById('anim-group').style.display = 'none';
      document.getElementById('path-group').style.display = 'none';
    }

    function setupPaths(model, gltfCameras = []) {
      model.updateMatrixWorld(true);
      const foundMap = {};

      const lNames = ['L転輪1', 'L転輪2', 'L転輪3', 'L転輪4', 'L転輪5', 'L転輪6', 'L補助転輪', 'L補助輪'];
      const rNames = ['R転輪1', 'R転輪2', 'R転輪3', 'R転輪4', 'R転輪5', 'R転輪6', 'R補助転輪', 'R補助輪'];

      const findOrCreateCameraFromNode = (node) => {
        if (node.isCamera) return node;
        let foundCam = null;
        node.traverse((c) => {
          if (!foundCam && c.isCamera) foundCam = c;
        });
        if (foundCam) return foundCam;

        const cam = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        node.add(cam);
        return cam;
      };

      model.traverse((child) => {
        if (child.name === 'L駆動輪' && child.isMesh) {
          lDriveWheel = { mesh: child, radius: getMeshRadius(child) };
        }
        if (child.name === 'R駆動輪' && child.isMesh) {
          rDriveWheel = { mesh: child, radius: getMeshRadius(child) };
        }
        // R駆動輪のバリエーション名（もし存在する場合の対応）
        if ((child.name === 'R駆動輪2' || child.name === 'R駆動輪3' || child.name === 'R駆動輪4' || child.name === 'R駆動輪5' || child.name === 'R駆動輪6') && child.isMesh) {
          rAssociatedWheels.push({ mesh: child, radius: getMeshRadius(child) });
        }

        // APCメッシュ(グループ)の検出
        if (child.name === 'APC') apcMesh = child;

        // 砲塔・砲身の検出
        if (child.name === '砲塔') turretMesh = child;
        if (child.name === '砲身') barrelMesh = child;

        // 車長・射手カメラの検出
        if (child.name === '車長') {
          commanderCamera = findOrCreateCameraFromNode(child);
          commanderInitialQuat = commanderCamera.quaternion.clone();
        }
        if (child.name === '射手') {
          gunnerCamera = findOrCreateCameraFromNode(child);
          gunnerInitialQuat = gunnerCamera.quaternion.clone();
        }

        if (lNames.includes(child.name) && child.isMesh) {
          lAssociatedWheels.push({ mesh: child, radius: getMeshRadius(child) });
        }
        if (rNames.includes(child.name) && child.isMesh) {
          rAssociatedWheels.push({ mesh: child, radius: getMeshRadius(child) });
        }

        const match = child.name.match(/^([LR])([1-9][0-9]?)$/);
        if (match) {
          const prefix = match[1];
          const num = parseInt(match[2], 10);
          if (num >= 1 && num <= 79) {
            foundMap[child.name] = child;
          }
        }
      });

      // gltf.cameras 配列側にも念のためチェック
      if (Array.isArray(gltfCameras)) {
        gltfCameras.forEach((cam) => {
          if (!commanderCamera && (cam.name === '車長' || (cam.parent && cam.parent.name === '車長'))) {
            commanderCamera = cam;
            commanderInitialQuat = commanderCamera.quaternion.clone();
          }
          if (!gunnerCamera && (cam.name === '射手' || (cam.parent && cam.parent.name === '射手'))) {
            gunnerCamera = cam;
            gunnerInitialQuat = gunnerCamera.quaternion.clone();
          }
        });
      }

      ['L', 'R'].forEach((prefix) => {
        const nodes = [];
        for (let i = 1; i <= 79; i++) {
          const mesh = foundMap[`${prefix}${i}`];
          if (mesh) {
            nodes.push({
              name: `${prefix}${i}`,
              mesh,
              initialLocalPos: mesh.position.clone(),
              initialLocalQuat: mesh.quaternion.clone()
            });
          }
        }
        pathGroups[prefix] = {
          nodes,
          stepOffset: 0,
          segmentProgress: 0,
          direction: 1,
          currentSpeed: 0,
          targetDirection: 1,
          wheelDir: 1,
          linearDistanceMoved: 0
        };
      });

      // 左右の履帯幅を算出（旋回角速度計算用）
      if (pathGroups.L.nodes.length > 0 && pathGroups.R.nodes.length > 0) {
        const dist = pathGroups.L.nodes[0].mesh.position.distanceTo(pathGroups.R.nodes[0].mesh.position);
        if (dist > 0.01) trackSpanWidth = dist;
      }

      const lCount = pathGroups.L.nodes.length;
      const rCount = pathGroups.R.nodes.length;
      const pathGroupEl = document.getElementById('path-group');

      if (lCount >= 2 || rCount >= 2) {
        pathGroupEl.style.display = 'flex';
        updatePathStatusText();
      } else {
        pathGroupEl.style.display = 'none';
      }
    }

    function setKeyDirections(key) {
      activeKey = key;
      let lTargetDir = 1, rTargetDir = 1;
      let lWheelDir = 1, rWheelDir = 1;

      // Wで前進（方向: 1）、Sで後退（方向: -1）に完全統一
      if (key === 'w') {
        lTargetDir = 1; rTargetDir = 1;
        lWheelDir = 1; rWheelDir = 1;
      } else if (key === 's') {
        lTargetDir = -1; rTargetDir = -1;
        lWheelDir = -1; rWheelDir = -1;
      } else if (key === 'a') {
        lTargetDir = 1; rTargetDir = -1;
        lWheelDir = -1; rWheelDir = 1;
      } else if (key === 'd') {
        lTargetDir = -1; rTargetDir = 1;
        lWheelDir = 1; rWheelDir = -1;
      }

      pathGroups.L.targetDirection = lTargetDir;
      pathGroups.R.targetDirection = rTargetDir;
      pathGroups.L.wheelDir = lWheelDir;
      pathGroups.R.wheelDir = rWheelDir;

      document.querySelectorAll('.wasd-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.key === key);
      });
      updatePathStatusText();
    }

    function updatePathStatusText() {
      if (!activeKey && pathGroups.L.currentSpeed < 0.01 && pathGroups.R.currentSpeed < 0.01) {
        document.getElementById('path-status').textContent = '停止中 (慣性待機)';
        return;
      }

      const lGroup = pathGroups.L;
      const rGroup = pathGroups.R;
      const parts = [];

      if (lGroup.nodes.length >= 2) {
        const len = lGroup.nodes.length;
        const nextL = lGroup.nodes[mod(lGroup.stepOffset + lGroup.direction, len)].name;
        parts.push(`L(${lGroup.direction === 1 ? '1→2' : '1→79'}): L1→${nextL}`);
      }
      if (rGroup.nodes.length >= 2) {
        const len = rGroup.nodes.length;
        const nextR = rGroup.nodes[mod(rGroup.stepOffset + rGroup.direction, len)].name;
        parts.push(`R(${rGroup.direction === 1 ? '1→2' : '1→79'}): R1→${nextR}`);
      }
      document.getElementById('path-status').textContent = parts.join(' / ');
    }

    const _tempPos = new THREE.Vector3();
    const _tempQuat = new THREE.Quaternion();

    function applyTransformFromSlot(item, slotA, slotB, t) {
      const mesh = item.mesh;

      _tempPos.lerpVectors(slotA.initialLocalPos, slotB.initialLocalPos, t);
      mesh.position.copy(_tempPos);

      if (isSyncRotation) {
        _tempQuat.slerpQuaternions(slotA.initialLocalQuat, slotB.initialLocalQuat, t);
        mesh.quaternion.copy(_tempQuat);
      }
    }

    function updateGroupMovement(group, delta) {
      const count = group.nodes.length;
      group.linearDistanceMoved = 0;
      if (count < 2) return;

      const targetSpeed = activeKey ? pathSpeedMultiplier : 0;
      group.currentSpeed += (targetSpeed - group.currentSpeed) * Math.min(1.0, inertiaFactor * delta);

      if (group.currentSpeed < 0.001) {
        group.currentSpeed = 0;
        return;
      }

      if (activeKey && group.direction !== group.targetDirection) {
        group.stepOffset = mod(group.stepOffset + group.direction, count);
        group.segmentProgress = group.segmentProgress > 0 ? (1 - group.segmentProgress) : 0;
        group.direction = group.targetDirection;
      }

      const dir = group.direction;
      let remainingBudget = group.currentSpeed * delta * 0.1;
      let totalLinearDistance = 0;

      let safetyGuard = 0;
      while (remainingBudget > 0 && safetyGuard < count) {
        safetyGuard++;
        const refFrom = group.nodes[mod(group.stepOffset, count)];
        const refTo = group.nodes[mod(group.stepOffset + dir, count)];
        const distance = refFrom.initialLocalPos.distanceTo(refTo.initialLocalPos);
        const angleDiff = refFrom.initialLocalQuat.angleTo(refTo.initialLocalQuat);

        const segmentLength = Math.max(distance, angleDiff * 0.5, 0.001);
        const remainingInSegment = (1 - group.segmentProgress) * segmentLength;

        if (remainingBudget >= remainingInSegment) {
          const stepFraction = 1 - group.segmentProgress;
          totalLinearDistance += distance * stepFraction;
          remainingBudget -= remainingInSegment;
          group.segmentProgress = 0;
          group.stepOffset = mod(group.stepOffset + dir, count);
        } else {
          const stepFraction = remainingBudget / segmentLength;
          totalLinearDistance += distance * stepFraction;
          group.segmentProgress += stepFraction;
          remainingBudget = 0;
        }
      }

      group.linearDistanceMoved = totalLinearDistance;

      const t = group.segmentProgress;
      for (let i = 0; i < count; i++) {
        const fromSlot = group.nodes[mod(i + group.stepOffset, count)];
        const toSlot = group.nodes[mod(i + group.stepOffset + dir, count)];
        applyTransformFromSlot(group.nodes[i], fromSlot, toSlot, t);
      }
    }

    function updateDriveWheelsRotation() {
      const lGroup = pathGroups.L;
      const rGroup = pathGroups.R;

      // 指定されたすべての車輪（L駆動輪、L転輪1〜6、L補助輪、L補助転輪、R駆動輪、R駆動輪2〜6、R転輪1〜6、R補助輪、R補助転輪）の回転速度を履帯の移動速度・量と完全に同期
      if (lDriveWheel) {
        const lRotDelta = (lGroup.linearDistanceMoved * lGroup.wheelDir) / lDriveWheel.radius;
        lDriveWheel.mesh.rotation.x += lRotDelta;
      }
      for (const wheel of lAssociatedWheels) {
        const wheelRotDelta = (lGroup.linearDistanceMoved * lGroup.wheelDir) / wheel.radius;
        wheel.mesh.rotation.x += wheelRotDelta;
      }

      if (rDriveWheel) {
        const rRotDelta = (rGroup.linearDistanceMoved * rGroup.wheelDir) / rDriveWheel.radius;
        rDriveWheel.mesh.rotation.x += rRotDelta;
      }
      for (const wheel of rAssociatedWheels) {
        const wheelRotDelta = (rGroup.linearDistanceMoved * rGroup.wheelDir) / wheel.radius;
        wheel.mesh.rotation.x += wheelRotDelta;
      }
    }

    // 履帯の移動速度に合わせてAPCの移動(+Z / -Z)および超信地旋回(+Y / -Y)を処理
    function updateApcMovement() {
      if (!apcMesh) return;

      const lGroup = pathGroups.L;
      const rGroup = pathGroups.R;

      const lSignedDist = lGroup.linearDistanceMoved * lGroup.wheelDir;
      const rSignedDist = rGroup.linearDistanceMoved * rGroup.wheelDir;

      const forwardDelta = (lSignedDist + rSignedDist) * 0.5;
      const turnDelta = (rSignedDist - lSignedDist) / trackSpanWidth;

      if (activeKey === 'w' || activeKey === 's') {
        if (Math.abs(forwardDelta) > 0.000001) {
          apcMesh.translateZ(forwardDelta);
        }
      } else if (activeKey === 'a' || activeKey === 'd') {
        if (Math.abs(turnDelta) > 0.000001) {
          apcMesh.rotation.y += turnDelta * 0.5;
        }
      }
    }

    // 砲塔・砲身の回転・昇降処理（回転速度を半分 0.9 に調整）
    function updateTurretAndBarrel(delta) {
      const maxRotSpeed = 0.9;
      const damping = Math.min(1.0, inertiaFactor * delta);

      // 砲塔旋回 (Q: +Y, E: -Y)
      if (turretMesh) {
        let targetTurretVel = 0;
        if (keysPressed['q']) targetTurretVel += maxRotSpeed;
        if (keysPressed['e']) targetTurretVel -= maxRotSpeed;

        turretCurrentVel += (targetTurretVel - turretCurrentVel) * damping;
        if (Math.abs(turretCurrentVel) > 0.0001) {
          turretMesh.rotation.y += turretCurrentVel * delta;
        } else {
          turretCurrentVel = 0;
        }
      }

      // 砲身昇降 (R: -Y方向 / 俯仰角, F: +Y方向)
      if (barrelMesh) {
        let targetBarrelVel = 0;
        if (keysPressed['r']) targetBarrelVel -= maxRotSpeed;
        if (keysPressed['f']) targetBarrelVel += maxRotSpeed;

        barrelCurrentVel += (targetBarrelVel - barrelCurrentVel) * damping;
        if (Math.abs(barrelCurrentVel) > 0.0001) {
          barrelMesh.rotation.x += barrelCurrentVel * delta;

          // 角度制限: Y-60~10°
          const minRad = THREE.MathUtils.degToRad(-60);
          const maxRad = THREE.MathUtils.degToRad(10);
          if (barrelMesh.rotation.x < minRad) {
            barrelMesh.rotation.x = minRad;
            barrelCurrentVel = 0;
          } else if (barrelMesh.rotation.x > maxRad) {
            barrelMesh.rotation.x = maxRad;
            barrelCurrentVel = 0;
          }
        } else {
          barrelCurrentVel = 0;
        }
      }
    }

    function updateAllPathsMovement(delta) {
      updateGroupMovement(pathGroups.L, delta);
      updateGroupMovement(pathGroups.R, delta);
      updateDriveWheelsRotation();
      updateApcMovement();
      updateTurretAndBarrel(delta);

      if (Math.random() < 0.1) updatePathStatusText();
    }

    function fitModelToView(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      model.position.x += (model.position.x - center.x);
      model.position.y += (model.position.y - box.min.y);
      model.position.z += (model.position.z - center.z);

      const newBox = new THREE.Box3().setFromObject(model);
      const newCenter = newBox.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const fov = defaultCamera.fov * (Math.PI / 180);
      const distance = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 1.6;

      defaultTarget.copy(newCenter);
      defaultCameraPos.set(
        newCenter.x + distance * 0.7,
        newCenter.y + distance * 0.5,
        newCenter.z + distance * 0.9
      );

      defaultCamera.near = maxDim / 100;
      defaultCamera.far = maxDim * 100;
      defaultCamera.updateProjectionMatrix();

      resetCamera();
    }

    function resetCamera() {
      switchCameraMode('default');
      defaultCamera.position.copy(defaultCameraPos);
      controls.target.copy(defaultTarget);
      controls.update();
    }

    function loadGLBFile(file) {
      if (!file) return;
      const url = URL.createObjectURL(file);
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('empty-hint').style.display = 'none';

      loader.load(
        url,
        (gltf) => {
          clearCurrentModel();
          currentModel = gltf.scene;
          scene.add(currentModel);
          fitModelToView(currentModel);
          setupPaths(currentModel, gltf.cameras);
          applyWireframe(document.getElementById('wireframe-toggle').checked);

          if (gltf.animations && gltf.animations.length > 0) {
            animations = gltf.animations;
            mixer = new THREE.AnimationMixer(currentModel);
            const animSelect = document.getElementById('anim-select');
            animSelect.innerHTML = '';
            animations.forEach((clip, index) => {
              const option = document.createElement('option');
              option.value = index;
              option.textContent = clip.name || `Animation ${index + 1}`;
              animSelect.appendChild(option);
            });
            document.getElementById('anim-group').style.display = 'flex';
            playAnimation(0);
          }
          URL.revokeObjectURL(url);
        },
        undefined,
        (error) => {
          console.error('GLB読み込みエラー:', error);
          alert('ファイルの読み込みに失敗しました。有効な .glb / .gltf ファイルか確認してください。');
          URL.revokeObjectURL(url);
        }
      );
    }

    function playAnimation(index) {
      if (!mixer || !animations[index]) return;
      if (activeAction) activeAction.stop();
      activeAction = mixer.clipAction(animations[index]);
      activeAction.play();
      isPlaying = true;
      document.getElementById('anim-play-btn').textContent = '一時停止';
    }

    function applyWireframe(enabled) {
      if (!currentModel) return;
      currentModel.traverse((child) => {
        if (child.isMesh && child.material) {
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((mat) => { mat.wireframe = enabled; });
        }
      });
    }

    // 車長・射手視点での首振り操作（マウス＆タッチ指操作対応）
    const domElem = renderer.domElement;
    domElem.addEventListener('pointerdown', (e) => {
      if (activeCamera === commanderCamera || activeCamera === gunnerCamera) {
        isPointerLooking = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerLooking) return;
      if (activeCamera !== commanderCamera && activeCamera !== gunnerCamera) {
        isPointerLooking = false;
        return;
      }
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      const sensitivity = 0.004;
      lookYaw -= dx * sensitivity;
      lookPitch -= dy * sensitivity;
      const maxPitch = THREE.MathUtils.degToRad(85);
      lookPitch = Math.max(-maxPitch, Math.min(maxPitch, lookPitch));

      updateFirstPersonLook();
    });

    window.addEventListener('pointerup', () => {
      isPointerLooking = false;
    });

    window.addEventListener('pointercancel', () => {
      isPointerLooking = false;
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      loadGLBFile(e.target.files[0]);
    });

    document.getElementById('path-rot-toggle').addEventListener('change', (e) => {
      isSyncRotation = e.target.checked;
      if (!isSyncRotation) {
        ['L', 'R'].forEach((prefix) => {
          pathGroups[prefix].nodes.forEach((item) => {
            item.mesh.quaternion.copy(item.initialLocalQuat);
          });
        });
      }
    });

    document.getElementById('path-speed-slider').addEventListener('input', (e) => {
      pathSpeedMultiplier = parseFloat(e.target.value);
    });

    document.getElementById('inertia-slider').addEventListener('input', (e) => {
      inertiaFactor = parseFloat(e.target.value);
    });

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      const key = e.key.toLowerCase();
      if (key === '1') {
        switchCameraMode('commander');
        return;
      }
      if (key === '2') {
        switchCameraMode('gunner');
        return;
      }
      if (['w', 'a', 's', 'd'].includes(key)) {
        setKeyDirections(key);
      }
      if (['q', 'e', 'r', 'f'].includes(key)) {
        keysPressed[key] = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === activeKey) {
        activeKey = null;
        document.querySelectorAll('.wasd-btn').forEach((btn) => btn.classList.remove('active'));
      }
      if (['q', 'e', 'r', 'f'].includes(key)) {
        keysPressed[key] = false;
      }
    });

    document.querySelectorAll('.wasd-btn').forEach((btn) => {
      const key = btn.dataset.key;
      btn.addEventListener('mousedown', () => setKeyDirections(key));
      btn.addEventListener('mouseup', () => {
        if (activeKey === key) {
          activeKey = null;
          btn.classList.remove('active');
        }
      });
    });

    document.getElementById('wireframe-toggle').addEventListener('change', (e) => {
      applyWireframe(e.target.checked);
    });

    document.getElementById('autorotate-toggle').addEventListener('change', (e) => {
      controls.autoRotate = e.target.checked;
    });

    document.getElementById('grid-toggle').addEventListener('change', (e) => {
      gridHelper.visible = e.target.checked;
    });

    document.getElementById('light-slider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      dirLight.intensity = val;
      renderer.toneMappingExposure = val / 1.5;
    });

    document.getElementById('bg-select').addEventListener('change', (e) => {
      scene.background = new THREE.Color(e.target.value);
    });

    document.getElementById('reset-camera-btn').addEventListener('click', resetCamera);

    document.getElementById('anim-select').addEventListener('change', (e) => {
      playAnimation(parseInt(e.target.value, 10));
    });

    document.getElementById('anim-play-btn').addEventListener('click', () => {
      if (!activeAction) return;
      isPlaying = !isPlaying;
      activeAction.paused = !isPlaying;
      document.getElementById('anim-play-btn').textContent = isPlaying ? '一時停止' : '再生';
    });

    const dropOverlay = document.getElementById('drop-overlay');
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) dropOverlay.classList.remove('active');
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      if (e.dataTransfer.files.length > 0) {
        loadGLBFile(e.dataTransfer.files[0]);
      }
    });

    window.addEventListener('resize', () => {
      updateCameraAspect();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && isPlaying) mixer.update(delta);
      updateAllPathsMovement(delta);
      if (controls.enabled) controls.update();
      renderer.render(scene, activeCamera);
    }
    animate();
  </script>
</body>
</html>
